{% extends "base.html" %}{% block title %}Admin Login · KURO{% endblock %}{% block content %}
<section class="login-wrap"><div class="eyebrow">PRIVATE ADMIN ACCESS</div><h1>Welcome to <em>KURO.</em></h1><p class="muted">Sign in to manage licenses, devices and online updates.</p>
